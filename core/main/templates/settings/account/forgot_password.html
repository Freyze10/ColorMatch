{% load static %}
<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>Forgot Password</title>
    <link rel="icon" type="image/png" href="{% static 'image/icon_logo/mbpi_no_bg.png' %}">
    <link rel="stylesheet" href="{% static 'css/bootstrap.min.css' %}">
    <link rel="stylesheet" href="{% static 'css/bootstrap-icons.css' %}">
    <link rel="stylesheet" href="{% static 'css/sidebar/sidebar.css' %}">
</head>
<body class="bg-light d-flex align-items-center justify-content-center vh-100">
    <div class="card shadow-sm" style="width: 380px;">
        <div class="card-body p-4">
            <h5 class="fw-bold mb-1">Forgot Password</h5>
            <p class="text-muted small mb-3">Enter your email and an administrator will review your request.</p>

            {% if messages %}
                {% for message in messages %}
                    <div class="alert alert-{{ message.tags }} py-2 small">{{ message }}</div>
                {% endfor %}
            {% endif %}

            <form method="POST">
                {% csrf_token %}
                <div class="mb-3">
                    <label class="small fw-bold">Email Address</label>
                    <input type="email" name="email" class="form-control form-control-sm" required>
                </div>
                <button type="submit" class="btn btn-dark-teal btn-sm w-100 text-white">Submit Request</button>
            </form>

            <div class="text-center mt-3">
                <a href="{% url 'signin' %}" class="small text-decoration-none">Back to login</a>
            </div>
        </div>
    </div>
</body>
</html>
