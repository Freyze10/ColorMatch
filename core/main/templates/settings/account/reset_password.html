{% load static %}
<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>Reset Password</title>
    <link rel="icon" type="image/png" href="{% static 'image/icon_logo/mbpi_no_bg.png' %}">
    <link rel="stylesheet" href="{% static 'css/bootstrap.min.css' %}">
    <link rel="stylesheet" href="{% static 'css/bootstrap-icons.css' %}">
    <link rel="stylesheet" href="{% static 'css/sidebar/sidebar.css' %}">
</head>
<body class="bg-light d-flex align-items-center justify-content-center vh-100">
    <div class="card shadow-sm" style="width: 380px;">
        <div class="card-body p-4">
            <h5 class="fw-bold mb-3">Set New Password</h5>

            {% if messages %}
                {% for message in messages %}
                    <div class="alert alert-{{ message.tags }} py-2 small">{{ message }}</div>
                {% endfor %}
            {% endif %}

            <form method="POST">
                {% csrf_token %}
                <div class="mb-2">
                    <label class="small fw-bold">New Password</label>
                    <input type="password" name="new_password" class="form-control form-control-sm" required>
                </div>
                <div class="mb-3">
                    <label class="small fw-bold">Confirm New Password</label>
                    <input type="password" name="confirm_password" class="form-control form-control-sm" required>
                </div>
                <button type="submit" class="btn btn-dark-teal btn-sm w-100 text-white">Reset Password</button>
            </form>
        </div>
    </div>
</body>
</html>
