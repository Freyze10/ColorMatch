{% extends "base.html" %}
{% load static %}
<!-- TODO: Create the view for the rs entry as well as the services and save that matcheds the cmf -->
{% block navigation %} 
RS Entry
{% endblock navigation %}

{% block content %}
<div class="container-fluid p-0">
    <form class="rs-entry-form" method="POST" action="{% url 'rs_entry' %}">
    {% csrf_token %}
        <input type="hidden" name="original_rs_no" value="{{ form_data.original_rs_id|default:'' }}">
        
        <div class="row g-2">
            <!-- LEFT COLUMN: Requisition & Customer Details -->
            <div class="col-lg-6">
                <div class="card cmf-entry-card mb-2 shadow-sm h-100">
                    <div class="card-body p-3">
                        <h6 class="cmf-section-title mb-3">Requisition Information</h6>

                        <div class="row g-2 mb-2">
                            <!-- RS Number -->
                            <div class="col-md-6">
                                <label class="fw-bold extra-small required-label">RS Number:</label>
                                <input type="text" name="rs_no" value="{{ form_data.rs_no|default:'' }}" class="form-control form-control-sm uniform-input" {% if is_edit %}readonly{% endif %} autocomplete="off" required>
                            </div>

                            <!-- CMF Number (FK to tbl_cmf) -->
                            <div class="col-md-6">
                                <label class="fw-bold extra-small required-label">CMF Number (CM No):</label>
                                <select class="form-select form-select-sm ts-select" name="cm_no" placeholder="Select CMF..." required>
                                    <option value=""></option>
                                    {% for cm in cmf_list %}
                                        <option value="{{ cm.cm_no }}" {% if form_data.cm_no == cm.cm_no %}selected{% endif %}>
                                            {{ cm.cm_no }}
                                        </option>
                                    {% endfor %}
                                </select>
                            </div>
                        </div>
                        <div class="row g-2 mb-2">
                            <div class="col-md-12">
                                <label class="fw-bold extra-small required-label">Product Code:</label>
                                <input type="text" name="product_code" value="{{ form_data.product_code|default:'' }}" class="form-control form-control-sm uniform-input readonly-gray" placeholder="Product Code" required readonly>
                            </div>
                        </div>
                        <!-- Customer -->
                        <div class="row g-2 mb-2">
                            <div class="col-md-12">
                                <label class="fw-bold extra-small required-label">Customer:</label>
                                <select class="form-select form-select-sm ts-select" name="customer" placeholder="Select customer..." required>
                                    <option value=""></option>
                                    {% for customer in customers %}
                                        <option value="{{ customer }}" {% if form_data.customer == customer %}selected{% endif %}>{{ customer }}</option>
                                    {% endfor %}
                                </select>
                            </div>
                        </div>

                        <!-- Sales Person -->
                        <div class="row g-2 mb-2">
                            <div class="col-md-12">
                                <label class="fw-bold extra-small required-label">Sales Person:</label>
                                <select class="form-select form-select-sm ts-select" name="salesman" placeholder="Select salesman..." required>
                                    <option value=""></option>
                                    {% for s in salesman %}
                                        <option value="{{ s.name }}" {% if form_data.salesman == s.name %}selected{% endif %}>{{ s.name }}</option>
                                    {% endfor %}
                                </select>
                            </div>
                        </div>

                        <!-- Quantity Required -->
                        <div class="row g-2 mb-2">
                            <div class="col-md-12">
                                <label class="fw-bold extra-small required-label">Quantity Required (KG):</label>
                                <input type="number" name="quantity_kg" step="0.01" value="{{ form_data.quantity_kg|default:'' }}" class="form-control form-control-sm uniform-input" placeholder="0.00" autocomplete="off" required>
                            </div>
                        </div>
                    </div>
                </div>
            </div>

            <!-- RIGHT COLUMN: Schedule & Lab Approval -->
            <div class="col-lg-6">
                <div class="card cmf-entry-card mb-2 shadow-sm h-100">
                    <div class="card-body p-3">
                        <h6 class="cmf-section-title mb-3">Schedule & Approval</h6>

                        <!-- Dates Row 1 -->
                        <div class="row g-2 mb-2">
                            <div class="col-6">
                                <label class="fw-bold extra-small required-label">Date Created:</label>
                                <div class="input-group input-group-sm flatpickr-container" data-wrap="true">
                                    <input type="text" name="date_created" value="{{ form_data.date_created|default:'' }}" class="form-control uniform-input date-picker-single" data-input autocomplete="off" required>
                                    <span class="input-group-text uniform-input border-start-0" data-toggle><i class="bi bi-calendar3"></i></span>
                                </div>
                            </div>
                            <div class="col-6">
                                <label class="fw-bold extra-small required-label">Required Date:</label>
                                <div class="input-group input-group-sm flatpickr-container" data-wrap="true">
                                    <input type="text" name="required_date" value="{{ form_data.required_date|default:'' }}" class="form-control uniform-input date-picker-asap" data-input autocomplete="off" required>
                                    <span class="input-group-text uniform-input border-start-0" data-toggle><i class="bi bi-calendar3"></i></span>
                                </div>
                            </div>
                        </div>

                        <!-- Dates Row 2 -->
                        <div class="row g-2 mb-2">
                            <div class="col-6">
                                <label class="fw-bold extra-small required-label">Date Received:</label>
                                <div class="input-group input-group-sm flatpickr-container" data-wrap="true">
                                    <input type="text" name="date_received" value="{{ form_data.date_received|default:'' }}" class="form-control uniform-input date-picker-multiple" data-input autocomplete="off" required>
                                    <span class="input-group-text uniform-input border-start-0" data-toggle><i class="bi bi-calendar3"></i></span>
                                </div>
                            </div>
                            <div class="col-6">
                                <label class="fw-bold extra-small required-label">Due Date:</label>
                                <div class="input-group input-group-sm flatpickr-container" data-wrap="true">
                                    <input type="text" name="due_date" value="{{ form_data.due_date|default:'' }}" class="form-control uniform-input date-picker-single" data-input autocomplete="off" required>
                                    <span class="input-group-text uniform-input border-start-0" data-toggle><i class="bi bi-calendar3"></i></span>
                                </div>
                            </div>
                        </div>

                        <!-- Approved By (Lab Personnel) -->
                        <div class="row g-2 mb-2">
                            <div class="col-md-12">
                                <label class="fw-bold extra-small required-label">Approved By (Lab Personnel):</label>
                                <select class="form-select form-select-sm ts-select" name="approved_by" placeholder="Select lab personnel..." required>
                                    <option value=""></option>
                                    {% for u in lab_personnel %}
                                        <option value="{{ u.id }}" {% if form_data.approved_by_id == u.id or form_data.approved_by == u.fullname|stringformat:"s" %}selected{% endif %}>
                                            {{ u.full_name|default:u.username }}
                                        </option>
                                    {% endfor %}
                                </select>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>

        <!-- ACTION BUTTONS -->
        <div class="d-flex justify-content-end align-items-center mt-3 mb-5 gap-1">
            <button type="button" class="btn btn-sm btn-primary px-3 shadow-sm btn-new"
            {% if not is_allowed %}disabled{% endif %}>
                <i class="bi bi-plus-lg"></i> New
            </button>
            <button type="button" class="btn btn-sm btn-success px-3 shadow-sm btn-save"
            {% if not is_allowed %}disabled{% endif %}>
                <i class="bi bi-save"></i> {% if form_data.original_rs_id %}Update RS{% else %}Save RS{% endif %}
            </button>
        </div>
    </form>
</div>
{% endblock %}
{% block scripts %}
<script src="{% static 'js/cmf/rs_entry.js' %}"></script>
{% endblock %}
