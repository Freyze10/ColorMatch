<div class="d-flex flex-column h-100">
    <!-- HEADER -->
    <div class="row g-2 mb-4 align-items-center">
        <div class="col">
            <h5 class="fw-bold m-0 mf-title text-uppercase">Formulation Records</h5>
            <small id="mfSelectedRecordLabel" class="text-muted"></small>
        </div>
         <!-- NEW: Column Selection Dropdown -->
        <div class="col-md-2">
            <select id="searchCol" class="form-select form-select-sm uniform-input">
                <option value="all" selected>All Fields</option>
                <option value="form_id">Form ID</option>
                <option value="index_no">Index #</option>
                <option value="customer">Customer</option>
                <option value="prod_code">Product Code</option>
                <option value="prod_color">Product Color</option>
            </select>
        </div>
        <div class="col-md-4">
            <div class="input-group input-group-sm">
                <input type="text" id="formulaRecordSearch" class="form-control uniform-input ps-2 border-end-0" placeholder="Search records...">
                <span class="input-group-text uniform-input border-start-0">
                    <i class="bi bi-search text-muted"></i>
                </span>
            </div>
        </div>
        <div class="col-auto">
            <button class="btn btn-sm btn-primary px-3 shadow-sm" id="btnRefreshTable">
                <i class="bi bi-arrow-clockwise"></i> Refresh
            </button>
        </div>
    </div>

    <div class="row g-3">
        <!-- MAIN RECORDS TABLE -->
        <div class="col-lg-8">
            <div class="mf-table-wrapper rounded-3 border h-100 bg-white shadow-sm">
                <!-- DataTables height is managed via scrollY in JS -->
                <table class="table table-hover align-middle mb-0 w-100" id="mfRecordsTable">
                    <thead>
                        <tr class="small text-uppercase">
                            <th class="ps-3">Form ID</th>
                            <th>Index #</th>
                            <th>Customer</th>
                            <th>Product Code</th>
                            <th>Product Color</th>
                            <th>Total Cons.</th>
                            <th class="pe-3">Dosage</th>
                        </tr>
                    </thead>
                    <tbody class="extra-small">
                        <!-- Empty! DataTables will inject rows here via AJAX -->
                    </tbody>
                </table>
            </div>
        </div>

        <!-- MATERIAL BREAKDOWN -->
        <div class="col-lg-4">
            <div class="mf-detail-card rounded-3 border h-100 bg-white shadow-sm d-flex flex-column">
                <div class="p-3 border-bottom d-flex align-items-center justify-content-between">
                    <h6 class="extra-small fw-bold text-uppercase text-teal m-0">
                        Material Breakdown
                    </h6>
                </div>
                <div class="mf-detail-scroll-body flex-grow-1 overflow-auto" style="max-height: 60vh;">
                    <table class="table table-sm align-middle mb-0" id="mfDetailTable">
                        <thead class="bg-light sticky-top">
                            <tr class="extra-small text-uppercase">
                                <th class="ps-3">Material Code</th>
                                <th class="pe-3 text-end">Concentration</th>
                            </tr>
                        </thead>
                        <tbody class="extra-small" id="mfDetailTableBody">
                            <tr>
                                <td colspan="2" class="text-center py-4 text-muted">Select a record to view its materials.</td>
                            </tr>
                        </tbody>
                    </table>
                </div>
            </div>
        </div>
    </div>

    <!-- FOOTER: length selector + record count + export -->
    <div class="mt-3 py-2 px-2 border-top bg-light rounded-bottom">
        <div class="d-flex flex-column flex-md-row justify-content-between align-items-md-center gap-3">
            
            <div class="d-flex align-items-center gap-3">
                <!-- ROW LENGTH SELECTOR -->
                <div class="d-flex align-items-center gap-2">
                    <label class="extra-small fw-bold text-muted text-uppercase">Display:</label>
                    <select id="mfTableLength" class="form-select form-select-sm uniform-input py-0" style="width: 100px; height: 28px; font-size: 0.75rem;">
                        <option value="100">100 rows</option>
                        <option value="500">500 rows</option>
                        <option value="1000" selected>1000 rows</option>
                        <option value="5000">5000 rows</option>
                    </select>
                </div>
                <!-- RECORD COUNT INFO -->
                <small id="formulaTableInfo" class="text-muted extra-small mt-1"></small>
            </div>

            <div class="d-flex align-items-center gap-2 position-relative">
                <button class="btn btn-sm btn-outline-secondary px-2" id="mfExportFilterBtn" type="button">
                    <i class="bi bi-sliders"></i>
                </button>
                
                <div id="mfExportFilterPanel" class="mf-export-filter-panel shadow-lg border rounded-3 bg-white p-3 d-none">
                    <label class="extra-small fw-bold d-block mb-1">Date Range</label>
                    <div class="d-flex align-items-center gap-2">
                        
                        <!-- START DATE CONTAINER -->
                        <div class="flatpickr-container input-group input-group-sm" data-wrap="true">
                            <input type="text" id="mfExportDateFrom" class="form-control date-picker-single" data-input placeholder="MM/DD/YYYY">
                            <span class="input-group-text" data-toggle><i class="bi bi-calendar3"></i></span>
                        </div>

                        <span class="extra-small">to</span>

                        <!-- END DATE CONTAINER -->
                        <div class="flatpickr-container input-group input-group-sm" data-wrap="true">
                            <input type="text" id="mfExportDateTo" class="form-control date-picker-single" data-input placeholder="MM/DD/YYYY">
                            <span class="input-group-text" data-toggle><i class="bi bi-calendar3"></i></span>
                        </div>

                    </div>
                </div>
                
                <button class="btn btn-success btn-sm px-4" id="mfExportExcelBtn" type="button">
                    <i class="bi bi-file-earmark-excel"></i> Export Excel
                </button>
            </div>
        </div>
    </div>
</div>

<style>
    .mf-export-filter-panel {
        position: absolute;
        bottom: calc(100% + 8px);
        right: 0;
        width: 300px;
        z-index: 1000;
    }
</style>

<script>
    // Using 'jQuery' instead of '$' to avoid any conflict with other libraries
    jQuery(document).ready(function($) {
        
        // --- 1. SETTINGS ---
        const tableId = '#mfRecordsTable';
        const ajaxUrl = "/formulation/data/";

        // --- 2. INITIALIZE ---
        const table = $(tableId).DataTable({
            serverSide: true,
            processing: true,
            deferRender: true,
            destroy: true,
            scrollY: '60vh',
            scrollCollapse: true,
            ajax: {
                url: ajaxUrl,
                type: "GET",
                data: function(d) {
                    d.length = $('#mfTableLength').val() || 1000; 
                    d.search_column = $('#searchCol').val();
                }
            },
            columns: [
                { data: "form_id", className: "ps-3 fw-bold text-teal" },
                { data: "index_no" },
                { data: "customer" },
                { data: "product_code" },
                { data: "prod_color" },
                { data: "total_concentration" },
                { data: "ld", className: "pe-3" }
            ],
            dom: 'rtp', // No default search box or length menu
            pageLength: 1000, 
            ordering: true,
            order: [[0, 'desc']],
            language: {
                processing: '<div class="d-flex justify-content-center py-5"><div class="spinner-border text-teal"></div></div>',
            },
            createdRow: function(row, data) {
                $(row).addClass('record-row').attr('data-form-id', data.form_id).css('cursor', 'pointer');
            },
            drawCallback: function(settings) {
                const api = this.api();
                const info = api.page.info();
                const total = info.recordsTotal.toLocaleString();
                const filtered = info.recordsDisplay.toLocaleString();

                if (info.recordsTotal === info.recordsDisplay) {
                    $('#formulaTableInfo').text("Total records: " + total);
                } else {
                    $('#formulaTableInfo').text("Showing " + filtered + " found (from " + total + " total)");
                }
            }
        });

        //  Search with debounce
        const handleSearch = debounce(function(value) {
            table.search(value).draw();
        }, 600);

        $('#formulaRecordSearch').on('input', function() {
            handleSearch(this.value);
        });

        // --- 4. ROW CLICK (Fetch Materials) ---
        $(tableId + ' tbody').on('click', 'tr', async function() {
            $('.record-row').removeClass('table-active');
            $(this).addClass('table-active');
            
            const formId = $(this).data('form-id');
            const detailBody = document.getElementById('mfDetailTableBody');
            
            detailBody.innerHTML = '<tr><td colspan="2" class="text-center py-4"><div class="spinner-border spinner-border-sm text-teal"></div></td></tr>';
            
            try {
                const response = await fetch(`/formulation/${encodeURIComponent(formId)}/materials/`);
                const data = await response.json();
                document.getElementById('mfSelectedRecordLabel').innerText = `# ${data.form_id} | Index: ${data.index_no} : ${data.customer}`;
                
                if (!data.materials || data.materials.length === 0) {
                    detailBody.innerHTML = '<tr><td colspan="2" class="text-center py-4 text-muted">No materials found.</td></tr>';
                    return;
                }
                detailBody.innerHTML = data.materials.map(m => `
                    <tr>
                        <td class="ps-3">${m.material_code}</td>
                        <td class="pe-3 text-end">${m.concentration}</td>
                    </tr>
                `).join('');
            } catch (err) {
                detailBody.innerHTML = '<tr><td colspan="2" class="text-center py-4 text-danger">Error loading details.</td></tr>';
            }
        });

        // --- 5. DOUBLE CLICK (Edit Mode) ---
        $(tableId + ' tbody').on('dblclick', 'tr', function() {
            const formId = $(this).data('form-id');
            window.location.href = `${window.location.pathname}?form_id=${formId}`;
        });

        // --- 6. CONTROLS ---
        $('#mfTableLength').on('change', function() {
            table.page.len(this.value).draw();
        });

        $('#btnRefreshTable').on('click', function() {
            table.ajax.reload(null, false);
        });
        
        const exportFilterBtn = document.getElementById('mfExportFilterBtn');
        const exportFilterPanel = document.getElementById('mfExportFilterPanel');
        if (exportFilterBtn) {
            exportFilterBtn.addEventListener('click', (e) => {
                e.stopPropagation();
                exportFilterPanel.classList.toggle('d-none');
            });
            document.addEventListener('click', (e) => {
                if (!exportFilterPanel.contains(e.target) && e.target !== exportFilterBtn) {
                    exportFilterPanel.classList.add('d-none');
                }
            });
        }

        // --- 7. EXPORT ---
        $('#mfExportExcelBtn').on('click', function() {
            // 1. Get values from the filter panel
            const from = $('#mfExportDateFrom').val() || '';
            const to = $('#mfExportDateTo').val() || '';

            // 2. Format the message for the confirmation dialog
            let dateRangeMsg = "Exporting all records.";
            if (from || to) {
                dateRangeMsg = `Exporting records from ${from || 'Start'} to ${to || 'End'}.`;
            }

            // 3. Trigger Preline Confirmation
            Preline.confirm(
                'Export to Excel',             // Title
                dateRangeMsg,                  // Message
                'success',                     // Type (green icon)
                () => {
                    // CONFIRMED ACTION:
                    // Construct the URL with query parameters
                    const exportUrl = `/formulation/export/?date_from=${encodeURIComponent(from)}&date_to=${encodeURIComponent(to)}`;
                    
                    // Redirect the browser to trigger the download
                    window.location.href = exportUrl;
                },
                () => {
                    // CANCELLED ACTION: Do nothing
                }
            );
        });
    });
</script>
