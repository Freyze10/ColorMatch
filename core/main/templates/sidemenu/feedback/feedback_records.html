<div class="d-flex flex-column">
    <div class="row g-2 mb-4 align-items-center">
        <div class="col">
            <h5 class="fw-bold m-0 pc-title text-uppercase">Feedback Records</h5>
        </div>
        <div class="col-md-3">
            <select id="feedbackSearchColumn" class="form-select form-select-sm uniform-input">
                <option value="-1" selected>All Fields</option>
                <option value="1">Matching No.</option>
                <option value="2">Customer</option>
                <option value="3">Product Code</option>
                <option value="4">Color Description</option>
                <option value="5">Finished Product</option>
                <option value="8">Type</option>
                <option value="9">Status</option>
            </select>
        </div>
        <div class="col-md-4">
            <div class="input-group input-group-sm">
                <input type="text" id="feedbackSearch" class="form-control uniform-input ps-2 border-end-0" placeholder="Search records...">
                <span class="input-group-text uniform-input border-start-0">
                    <i class="bi bi-search text-muted"></i>
                </span>
            </div>
        </div>
        <div class="col-auto">
            <button class="btn btn-sm btn-primary px-3 shadow-sm" id="btnRefreshFeedback">
                <i class="bi bi-arrow-clockwise"></i> Refresh
            </button>
        </div>
    </div>

    <div class="feedback-table-wrapper rounded-3 border">
        <table class="table table-hover align-middle mb-0" id="feedbackTable" style="width: 100%;">
            <thead class="sticky-top bg-white" style="z-index: 10;">
                <tr class="small text-uppercase">
                    <th class="d-none">ID</th>
                    <th class="ps-3">Matching No.</th>
                    <th>Customer</th>
                    <th>Product Code</th>
                    <th>Color Description</th>
                    <th>Finished Product</th>
                    <th>Required</th>
                    <th>Due Date</th>
                    <th>Type</th>
                    <th>Status</th>
                    <th>Details</th>
                    <th class="pe-3">Package Details</th>
                </tr>
            </thead>
            <tbody class="extra-small">
                <!-- DataTables injects rows via AJAX -->
            </tbody>
        </table>
    </div>

    <div class="mt-4 d-flex flex-column flex-md-row justify-content-between align-items-md-center gap-3">
        <small id="feedbackTableInfo" class="text-muted fw-bold"></small>

        <div class="d-flex align-items-center gap-2 position-relative">
            <button class="btn btn-sm btn-outline-secondary px-2" id="feedbackExportFilterBtn" type="button">
                <i class="bi bi-sliders"></i>
            </button>

            <div id="feedbackExportPanel" class="feedback-export-panel shadow-lg border rounded-3 bg-white p-3 d-none">
                <label class="extra-small fw-bold d-block mb-1 text-uppercase">Date Created Range</label>
                <div class="d-flex align-items-center gap-2">
                    <div class="flatpickr-container input-group input-group-sm" data-wrap="true">
                        <input type="text" id="exportDateFrom" class="form-control date-picker-single" data-input placeholder="From">
                        <span class="input-group-text" data-toggle><i class="bi bi-calendar3"></i></span>
                    </div>
                    <span class="extra-small text-muted">to</span>
                    <div class="flatpickr-container input-group input-group-sm" data-wrap="true">
                        <input type="text" id="exportDateTo" class="form-control date-picker-single" data-input placeholder="To">
                        <span class="input-group-text" data-toggle><i class="bi bi-calendar3"></i></span>
                    </div>
                </div>
            </div>

            <button class="btn btn-sm btn-success px-4 shadow-sm" id="btnExportFeedback">
                <i class="bi bi-file-earmark-excel me-2"></i>Export to Excel
            </button>
        </div>
    </div>
</div>

<style>
    .feedback-export-panel {
        position: absolute;
        bottom: calc(100% + 10px);
        right: 0;
        width: 320px;
        z-index: 1050;
    }
</style>

<script>
jQuery(document).ready(function($) {
    const tableId = '#feedbackTable';
    const ajaxUrl = "{% url 'feedback_records_data' %}";

    if ($.fn.DataTable.isDataTable(tableId)) {
        $(tableId).DataTable().destroy();
    }

    const table = $(tableId).DataTable({
        serverSide: true,
        processing: true,
        deferRender: true,
        scrollY: '70vh',
        scrollCollapse: true,
        ajax: {
            url: ajaxUrl,
            type: "GET"
        },
        columns: [
            { data: "feedback_no", className: "d-none" },
            { data: "matching_no", className: "ps-3 fw-bold", render: (data, type, row) => {
                const cls = row.mode === 'rs' ? 'text-primary' : 'text-teal';
                return `<span class="${cls}">${data}</span>`;
            }},
            { data: "customer" },
            { data: "prod_code", render: (data) => `<code>${data}</code>` },
            { data: "color_desc" },
            { data: "finished_prod" },
            { data: "required_date" },
            { data: "due_date" },
            { data: "type" },
            { data: "status", render: (data) => renderStatusBadge(data) },
            { data: "details", className: "text-truncate", render: (data) => `<span title="${data}">${data}</span>` },
            { data: "package_details", className: "pe-3" },
        ],
        dom: 'rtp',
        pageLength: 100,
        order: [[1, 'desc']],
        language: {
            processing: '<div class="d-flex justify-content-center py-5"><div class="spinner-border text-teal"></div></div>',
        },
        createdRow: function(row, data) {
            $(row).addClass('record-row')
                  .attr('data-mode', data.mode)
                  .attr('title', 'Double-click to open feedback entry')
                  .css('cursor', 'pointer');
        },
        drawCallback: function() {
            const info = this.api().page.info();
            const total = info.recordsTotal.toLocaleString();
            const filtered = info.recordsDisplay.toLocaleString();
            $('#feedbackTableInfo').text(
                info.recordsTotal === info.recordsDisplay
                    ? "Total records: " + total
                    : "Showing " + filtered + " found (from " + total + " total)"
            );
        }
    });

    function renderStatusBadge(status) {
        const s = (status || '').toLowerCase();
        const map = { pending: 'warning', rematch: 'primary', abandoned: 'danger', ordered: 'dark' };
        let variant = map[s];
        if (!variant && s.includes('approved')) variant = 'success';
        if (!variant && s.includes('request')) variant = 'info';
        if (!variant) return `<span class="badge bg-light text-dark border border-secondary">${status}</span>`;
        return `<span class="badge bg-${variant}-subtle text-${variant} border border-${variant}">${status}</span>`;
    }

    // --- Column-aware search, same pattern as Formula Records ---
    $('#feedbackSearch').on('input', function() {
        const colIndex = parseInt($('#feedbackSearchColumn').val(), 10);
        const value = $(this).val();

        table.columns().search('');
        table.search('');

        if (colIndex === -1) {
            table.search(value).draw();
        } else {
            table.column(colIndex).search(value).draw();
        }
    });

    $('#feedbackSearchColumn').on('change', function() {
        $('#feedbackSearch').val('');
        table.search('');
        table.columns().search('');
        table.draw();
    });

    // --- Double-click to open feedback entry (unchanged behavior) ---
    $(tableId + ' tbody').on('dblclick', 'tr', function() {
        const rowData = table.row(this).data();
        if (!rowData) return;
        window.location.href = `${window.location.pathname}?feedback_no=${rowData.feedback_no}`;
    });

    $('#btnRefreshFeedback').on('click', function() { table.ajax.reload(null, false); });

    const exportFilterBtn = document.getElementById('feedbackExportFilterBtn');
    const exportPanel = document.getElementById('feedbackExportPanel');
    exportFilterBtn.addEventListener('click', (e) => {
        e.stopPropagation();
        exportPanel.classList.toggle('d-none');
    });
    document.addEventListener('click', (e) => {
        if (!exportPanel.contains(e.target) && e.target !== exportFilterBtn) {
            exportPanel.classList.add('d-none');
        }
    });

    $('#btnExportFeedback').on('click', function() {
        const fromDate = $('#exportDateFrom').val().trim();
        const toDate = $('#exportDateTo').val().trim();
        let confirmMsg = 'Are you sure you want to export all feedback records?';
        if (fromDate && toDate) {
            confirmMsg = `Are you sure you want to export feedback records from ${fromDate} to ${toDate}?`;
        }
        Preline.confirm('Export Feedback', confirmMsg, 'success', () => {
            if (typeof showLoader === "function") showLoader();
            const baseUrl = "{% url 'export_feedback_excel' %}";
            const params = new URLSearchParams();
            if (fromDate) params.append('from', fromDate);
            if (toDate) params.append('to', toDate);
            window.location.href = params.toString() ? `${baseUrl}?${params.toString()}` : baseUrl;
            setTimeout(() => { if (typeof hideLoader === "function") hideLoader(); }, 3000);
        });
    });
});
</script>
