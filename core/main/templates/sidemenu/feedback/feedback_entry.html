<div class="feedback-entry-form-container">
    <form id="feedbackEntryForm" method="POST">
        {% csrf_token %}
        <input type="hidden" name="feedback_no" value="{{ form_data.feedback_no|default:'' }}">
        <input type="hidden" name="record_type" value="{{ form_data.record_type|default:'cmf' }}">
        <div class="row g-4">
            <!-- LEFT COLUMN -->
            <div class="col-lg-6">
                <div class="row g-2 align-items-center mb-3">
                    <div class="col-md-3"><label class="extra-small fw-bold">Matching No:</label></div>
                    <div class="col-md-9"><input type="text" id="id_f_matching_no" class="form-control form-control-sm uniform-input readonly-gray" value="{{ form_data.matching_no|default:'' }}" readonly required></div>
                </div>

                <div class="row g-2 align-items-center mb-3">
                    <div class="col-md-3"><label class="extra-small fw-bold">Customer:</label></div>
                    <div class="col-md-9"><input type="text" id="id_f_customer" class="form-control form-control-sm uniform-input readonly-gray" value="{{ form_data.customer|default:'' }}" readonly required></div>
                </div>

                <!-- Date Created & Required Date Row -->
                <div class="row g-2 align-items-center mb-3">
                    <div class="col-md-3"><label class="extra-small fw-bold">Date Created:</label></div>
                    <div class="col-md-4">
                        <div class="input-group input-group-sm flatpickr-container" data-wrap="true">
                            <input type="text" id="id_f_date_created" class="form-control uniform-input date-picker-single readonly-gray" placeholder="MM/DD/YYYY" value="{{ form_data.date_created|default:'' }}" data-input readonly required>
                            <span class="input-group-text uniform-input border-start-0" data-toggle><i class="bi bi-calendar3"></i></span>
                        </div>
                    </div>
                    <div class="col-md-1 px-0 text-center"><label class="extra-small">Req:</label></div>
                    <div class="col-md-4">
                        <div class="input-group input-group-sm flatpickr-container" data-wrap="true">
                            <input type="text" id="id_f_required_date" class="form-control uniform-input date-picker-asap readonly-gray" placeholder="MM/DD/YYYY or ASAP" value="{{ form_data.required_date|default:'' }}" data-input readonly required>
                            <span class="input-group-text uniform-input border-start-0" data-toggle><i class="bi bi-calendar3"></i></span>
                        </div>
                    </div>
                </div>

                <!-- Date Received & Due Date Row -->
                <div class="row g-2 align-items-center mb-3">
                    <div class="col-md-3"><label class="extra-small fw-bold">Date Received:</label></div>
                    <div class="col-md-4">
                        <div class="input-group input-group-sm flatpickr-container" data-wrap="true">
                            <input type="text" id="id_f_date_received" class="form-control uniform-input date-picker-multiple readonly-gray" placeholder="MM/DD/YYYY, MM/DD/YYYY" value="{{ form_data.date_received|default:'' }}" data-input readonly required>
                            <span class="input-group-text uniform-input border-start-0" data-toggle><i class="bi bi-calendar3"></i></span>
                        </div>
                    </div>
                    <div class="col-md-1 px-0 text-center"><label class="extra-small">Due:</label></div>
                    <div class="col-md-4">
                        <div class="input-group input-group-sm flatpickr-container" data-wrap="true">
                            <input type="text" id="id_f_due_date" class="form-control uniform-input date-picker-single readonly-gray" placeholder="MM/DD/YYYY" value="{{ form_data.due_date|default:'' }}" data-input readonly required>
                            <span class="input-group-text uniform-input border-start-0" data-toggle><i class="bi bi-calendar3"></i></span>
                        </div>
                    </div>
                </div>

                <div class="row g-2 align-items-center mb-3">
                    <div class="col-md-3"><label class="extra-small fw-bold">Finished Product:</label></div>
                    <div class="col-md-9"><input type="text" id="id_f_finished_product" class="form-control form-control-sm uniform-input readonly-gray" value="{{ form_data.finished_product|default:'' }}" readonly required></div>
                </div>

                <div class="row g-2 align-items-center mb-3">
                    <div class="col-md-3"><label class="extra-small fw-bold">Color Description:</label></div>
                    <div class="col-md-9"><input type="text" id="id_f_color_description" class="form-control form-control-sm uniform-input readonly-gray" value="{{ form_data.color_description|default:'' }}" readonly required></div>
                </div>

                <div class="row g-2 align-items-center mb-3">
                    <div class="col-md-3"><label class="extra-small fw-bold">Matching Type:</label></div>
                    <div class="col-md-9"><input type="text" id="id_f_matching_type" class="form-control form-control-sm uniform-input readonly-gray" value="{{ form_data.matching_type|default:'' }}" readonly required></div>
                </div>

                <div class="row g-2 align-items-center mb-3">
                    <div class="col-md-3"><label class="extra-small fw-bold">Sales Person:</label></div>
                    <div class="col-md-9"><input type="text" id="id_f_sales_person" class="form-control form-control-sm uniform-input readonly-gray" value="{{ form_data.sales_person|default:'' }}" readonly required></div>
                </div>

                <!-- Feedback Specific Section — the ONLY editable fields on this page -->
                <div class="mt-4 pt-2">
                    <h6 class="feedback-section-title mb-3">Feedback & Monitoring</h6>

                    <div class="row g-2 align-items-center mb-3">
                        <div class="col-md-3"><label class="extra-small fw-bold">Feedback Status:</label></div>
                        <div class="col-md-9">
                            <select name="feedback_status" id="id_f_feedback_status" class="form-select form-select-sm uniform-input">
                                {% for choice in form_data.status_choices %}
                                    <option value="{{ choice }}" {% if form_data.feedback_status == choice %}selected{% endif %}>{{ choice }}</option>
                                {% endfor %}
                            </select>
                        </div>
                    </div>
                    
                    <div class="row g-2 align-items-center mb-3">
                        <div class="col-md-3"><label class="extra-small fw-bold">Date Sample Received:</label></div>
                        <div class="col-md-9">
                            <div class="input-group input-group-sm flatpickr-container" data-wrap="true">
                                <input type="text" name="date_sample_received" id="id_f_date_sample_received" 
                                    class="form-control uniform-input date-picker-single" 
                                    placeholder="MM/DD/YYYY (Optional)" data-input
                                    value="{{ form_data.date_sample_received|default:'' }}">
                                <span class="input-group-text uniform-input border-start-0" data-toggle><i class="bi bi-calendar3"></i></span>
                            </div>
                        </div>
                    </div>

                    <div class="row g-2 align-items-center mb-3">
                        <div class="col-md-3"><label class="extra-small fw-bold">Comments:</label></div>
                        <div class="col-md-9"><input type="text" name="comments" id="id_f_comments" class="form-control form-control-sm uniform-input" placeholder="Enter feedback observations..." value="{{ form_data.comments|default:'' }}"></div>
                    </div>

                    <div class="row g-2 align-items-center mb-3">
                        <div class="col-md-3"><label class="extra-small fw-bold">Storage Details:</label></div>
                        <div class="col-md-9"><input type="text" name="storage_details" id="id_f_storage_details" class="form-control form-control-sm uniform-input" placeholder="Box #, Plastic Bin location..." value="{{ form_data.storage_details|default:'' }}"></div>
                    </div>
                </div>
            </div>

            <!-- RIGHT COLUMN -->
            <div class="col-lg-6">
                <div class="row g-2 align-items-center mb-3">
                    <div class="col-md-3"><label class="extra-small fw-bold">Current Status:</label></div>
                    <div class="col-md-9"><input type="text" id="id_f_current_status" class="form-control form-control-sm uniform-input readonly-gray" value="{{ form_data.current_status|default:'' }}" readonly required></div>
                </div>

                <div class="row g-2 align-items-center mb-3">
                    <div class="col-md-3"><label class="extra-small fw-bold">Pending Reason:</label></div>
                    <div class="col-md-9"><input type="text" id="id_f_pending_reason" class="form-control form-control-sm uniform-input readonly-gray" value="{{ form_data.pending_reason|default:'' }}" readonly required></div>
                </div>

                <div class="row g-2 align-items-center mb-3">
                    <div class="col-md-3"><label class="extra-small fw-bold">Product Code:</label></div>
                    <div class="col-md-9"><input type="text" id="id_f_product_code" class="form-control form-control-sm uniform-input readonly-gray" value="{{ form_data.product_code|default:'' }}" readonly required></div>
                </div>

                <div class="row g-2 align-items-center mb-3">
                    <div class="col-md-3"><label class="extra-small fw-bold">Code Description:</label></div>
                    <div class="col-md-9"><input type="text" name="code_description" id="id_f_code_description" class="form-control form-control-sm uniform-input readonly-gray" value="{{ form_data.code_description|default:'' }}" readonly></div>
                </div>

                <div class="row g-2 align-items-center mb-3">
                    <div class="col-md-3"><label class="extra-small fw-bold">Set-Pc:</label></div>
                    <div class="col-md-4"><input type="text" id="id_f_set_pc" class="form-control form-control-sm uniform-input readonly-gray" placeholder="Qty" value="{{ form_data.set_pc|default:'' }}" readonly required></div>
                    <div class="col-md-1 px-0 text-center"><label class="extra-small fw-bold">Quantity:</label></div>
                    <div class="col-md-4"><input type="text" id="id_f_quantity_kg" class="form-control form-control-sm uniform-input readonly-gray" placeholder="KG" value="{{ form_data.quantity_kg|default:'' }}" readonly required></div>
                </div>

                <div class="row g-2 align-items-center mb-3">
                    <div class="col-md-3"><label class="extra-small fw-bold">Date Submitted:</label></div>
                    <div class="col-md-9">
                        <div class="input-group input-group-sm flatpickr-container" data-wrap="true">
                            <input type="text" id="id_f_date_submitted" class="form-control uniform-input date-picker-single readonly-gray" placeholder="MM/DD/YYYY" value="{{ form_data.date_submitted|default:'' }}" data-input readonly required>
                            <span class="input-group-text uniform-input border-start-0" data-toggle><i class="bi bi-calendar3"></i></span>
                        </div>
                    </div>
                </div>

                <div class="row g-2 align-items-center mb-3">
                    <div class="col-md-3"><label class="extra-small fw-bold">Lot No.:</label></div>
                    <div class="col-md-9"><input type="text" id="id_f_lot_no" class="form-control form-control-sm uniform-input readonly-gray" value="{{ form_data.lot_no|default:'' }}" required readonly></div>
                </div>

                <div class="row g-2 align-items-center mb-3">
                    <div class="col-md-3"><label class="extra-small fw-bold">AR Number:</label></div>
                    <div class="col-md-9"><input type="text" id="id_f_ar_number" class="form-control form-control-sm uniform-input readonly-gray" value="{{ form_data.ar_number|default:'' }}" readonly required></div>
                </div>

                <div class="row g-2 align-items-center mb-3">
                    <div class="col-md-3"><label class="extra-small fw-bold">AR Date:</label></div>
                    <div class="col-md-9">
                        <div class="input-group input-group-sm flatpickr-container" data-wrap="true">
                            <input type="text" id="id_f_ar_date" class="form-control uniform-input date-picker-single readonly-gray" placeholder="MM/DD/YYYY" value="{{ form_data.ar_date|default:'' }}" data-input readonly required>
                            <span class="input-group-text uniform-input border-start-0" data-toggle><i class="bi bi-calendar3"></i></span>
                        </div>
                    </div>
                </div>
            </div>
        </div>

        <!-- Action Button -->
        <div class="mt-5 d-flex justify-content-end">
            <button type="button" class="btn btn-success btn-sm px-4 py-2 shadow-sm btn-save-feedback">
                <i class="bi bi-save me-2"></i>Save Update
            </button>
        </div>
    </form>
</div>
