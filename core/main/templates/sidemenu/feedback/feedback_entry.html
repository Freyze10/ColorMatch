<div class="feedback-entry-form-container">
    <form id="feedbackEntryForm" method="POST">
        {% csrf_token %}
        <input type="hidden" name="feedback_no" value="{{ form_data.feedback_no|default:'' }}">
        <input type="hidden" name="record_type" value="{{ form_data.record_type|default:'cmf' }}">
        
        <div class="row g-3">
            <!-- ==================== LEFT COLUMN: READONLY / REFERENCE INFO ==================== -->
            <div class="col-lg-6">
                <div class="card h-100 shadow-sm border rounded-3 bg-white">
                    <div class="card-header bg-light border-bottom py-2 px-3">
                        <h6 class="extra-small fw-bold text-uppercase text-muted m-0">CMF & Tracking Information</h6>
                    </div>
                    <div class="card-body p-3">
                        <!-- Matching No. -->
                        <div class="row g-2 align-items-center mb-2">
                            <div class="col-sm-4"><label class="extra-small fw-bold">Matching No:</label></div>
                            <div class="col-sm-8">
                                <input type="text" id="id_f_matching_no" 
                                       class="form-control form-control-sm uniform-input readonly-gray fw-bold" 
                                       value="{{ form_data.matching_no|default:'' }}" readonly required>
                            </div>
                        </div>

                        <!-- Customer -->
                        <div class="row g-2 align-items-center mb-2">
                            <div class="col-sm-4"><label class="extra-small fw-bold">Customer:</label></div>
                            <div class="col-sm-8">
                                <input type="text" id="id_f_customer" 
                                       class="form-control form-control-sm uniform-input readonly-gray" 
                                       value="{{ form_data.customer|default:'' }}" readonly required>
                            </div>
                        </div>

                        <!-- Product Code (Styled Danger Bold) -->
                        <div class="row g-2 align-items-center mb-2">
                            <div class="col-sm-4"><label class="extra-small fw-bold">Product Code:</label></div>
                            <div class="col-sm-8">
                                <input type="text" id="id_f_product_code" 
                                       class="form-control form-control-sm uniform-input readonly-gray fw-bold text-danger" 
                                       value="{{ form_data.product_code|default:'' }}" readonly required>
                            </div>
                        </div>

                        <!-- Date Created & Required Date Row -->
                        <div class="row g-2 align-items-center mb-2">
                            <div class="col-sm-4"><label class="extra-small fw-bold">Date Created:</label></div>
                            <div class="col-sm-8">
                                <div class="row g-2 align-items-center">
                                    <div class="col-6">
                                        <div class="input-group input-group-sm flatpickr-container" data-wrap="true">
                                            <input type="text" id="id_f_date_created" 
                                                class="form-control uniform-input date-picker-single readonly-gray" 
                                                placeholder="MM/DD/YYYY" value="{{ form_data.date_created|default:'' }}" data-input readonly required>
                                            <span class="input-group-text uniform-input border-start-0" data-toggle><i class="bi bi-calendar3"></i></span>
                                        </div>
                                    </div>
                                    <div class="col-6">
                                        <div class="d-flex align-items-center gap-1">
                                            <span class="extra-small fw-bold text-muted">Req:</span>
                                            <div class="input-group input-group-sm flatpickr-container flex-grow-1" data-wrap="true">
                                                <input type="text" id="id_f_required_date" 
                                                    class="form-control uniform-input date-picker-asap readonly-gray" 
                                                    placeholder="MM/DD/YYYY or ASAP" value="{{ form_data.required_date|default:'' }}" data-input readonly required>
                                                <span class="input-group-text uniform-input border-start-0" data-toggle><i class="bi bi-calendar3"></i></span>
                                            </div>
                                        </div>
                                    </div>
                                </div>
                            </div>
                        </div>

                        <!-- Date Received & Due Date Row -->
                        <div class="row g-2 align-items-center mb-2">
                            <div class="col-sm-4"><label class="extra-small fw-bold">Date Received:</label></div>
                            <div class="col-sm-8">
                                <div class="row g-2 align-items-center">
                                    <div class="col-6">
                                        <div class="input-group input-group-sm flatpickr-container" data-wrap="true">
                                            <input type="text" id="id_f_date_received" 
                                                class="form-control uniform-input date-picker-multiple readonly-gray" 
                                                placeholder="MM/DD/YYYY" value="{{ form_data.date_received|default:'' }}" data-input readonly required>
                                            <span class="input-group-text uniform-input border-start-0" data-toggle><i class="bi bi-calendar3"></i></span>
                                        </div>
                                    </div>
                                    <div class="col-6">
                                        <div class="d-flex align-items-center gap-1">
                                            <span class="extra-small fw-bold text-muted">Due:</span>
                                            <div class="input-group input-group-sm flatpickr-container flex-grow-1" data-wrap="true">
                                                <input type="text" id="id_f_due_date" 
                                                    class="form-control uniform-input date-picker-single readonly-gray" 
                                                    placeholder="MM/DD/YYYY" value="{{ form_data.due_date|default:'' }}" data-input readonly required>
                                                <span class="input-group-text uniform-input border-start-0" data-toggle><i class="bi bi-calendar3"></i></span>
                                            </div>
                                        </div>
                                    </div>
                                </div>
                            </div>
                        </div>

                        <!-- Finished Product -->
                        <div class="row g-2 align-items-center mb-2">
                            <div class="col-sm-4"><label class="extra-small fw-bold">Finished Product:</label></div>
                            <div class="col-sm-8">
                                <input type="text" id="id_f_finished_product" 
                                       class="form-control form-control-sm uniform-input readonly-gray" 
                                       value="{{ form_data.finished_product|default:'' }}" readonly required>
                            </div>
                        </div>

                        <!-- Color Description -->
                        <div class="row g-2 align-items-center mb-2">
                            <div class="col-sm-4"><label class="extra-small fw-bold">Color Description:</label></div>
                            <div class="col-sm-8">
                                <input type="text" id="id_f_color_description" 
                                       class="form-control form-control-sm uniform-input readonly-gray" 
                                       value="{{ form_data.color_description|default:'' }}" readonly required>
                            </div>
                        </div>

                        <!-- Sales Person -->
                        <div class="row g-2 align-items-center mb-2">
                            <div class="col-sm-4"><label class="extra-small fw-bold">Sales Person:</label></div>
                            <div class="col-sm-8">
                                <input type="text" id="id_f_sales_person" 
                                       class="form-control form-control-sm uniform-input readonly-gray" 
                                       value="{{ form_data.sales_person|default:'' }}" readonly required>
                            </div>
                        </div>

                        <!-- Current Status -->
                        <div class="row g-2 align-items-center mb-2">
                            <div class="col-sm-4"><label class="extra-small fw-bold">Current Status:</label></div>
                            <div class="col-sm-8">
                                <input type="text" id="id_f_current_status" 
                                       class="form-control form-control-sm uniform-input readonly-gray" 
                                       value="{{ form_data.current_status|default:'' }}" readonly required>
                            </div>
                        </div>

                        <!-- Pending Reason (Only if not completed) -->
                        {% if form_data.current_status|lower != 'completed' %}
                        <div class="row g-2 align-items-center mb-2" id="pendingReasonRow">
                            <div class="col-sm-4"><label class="extra-small fw-bold">Pending Reason:</label></div>
                            <div class="col-sm-8">
                                <input type="text" id="id_f_pending_reason" 
                                       class="form-control form-control-sm uniform-input readonly-gray" 
                                       value="{{ form_data.pending_reason|default:'' }}" readonly>
                            </div>
                        </div>
                        {% endif %}

                        <!-- Submitted Options -->
                        <div class="row g-2 align-items-center mb-2">
                            <div class="col-sm-4"><label class="extra-small fw-bold">Submitted:</label></div>
                            <div class="col-sm-8">
                                <div class="d-flex align-items-center flex-wrap gap-3">
                                    {% if form_data.submitted_options %}
                                        {% for opt in form_data.submitted_options %}
                                        <div class="form-check mb-0">
                                            <input class="form-check-input visible-check" type="checkbox" name="submitted_options"
                                                id="submitted_option_{{ opt.option_id }}" value="{{ opt.option_id }}"
                                                {% if opt.option_id in form_data.selected_option_ids or opt.is_checked %}checked{% endif %} disabled>
                                            <label class="form-check-label extra-small" for="submitted_option_{{ opt.option_id }}">{{ opt.name }}</label>
                                        </div>
                                        {% endfor %}
                                    {% else %}
                                        <div class="form-check mb-0">
                                            <input class="form-check-input visible-check" type="checkbox" name="submitted_options" id="f_opt_sample"
                                                {% if form_data.has_sample or 'sample' in form_data.submitted_str|lower or form_data.quantity_kg %}checked{% endif %} disabled>
                                            <label class="form-check-label extra-small" for="f_opt_sample">Sample</label>
                                        </div>
                                        <div class="form-check mb-0">
                                            <input class="form-check-input visible-check" type="checkbox" name="submitted_options" id="f_opt_chips"
                                                {% if form_data.has_chips or 'chip' in form_data.submitted_str|lower or form_data.set_pc %}checked{% endif %} disabled>
                                            <label class="form-check-label extra-small" for="f_opt_chips">Chips</label>
                                        </div>
                                        <div class="form-check mb-0">
                                            <input class="form-check-input visible-check" type="checkbox" name="submitted_options" id="f_opt_price"
                                                {% if form_data.has_price or 'price' in form_data.submitted_str|lower %}checked{% endif %} disabled>
                                            <label class="form-check-label extra-small" for="f_opt_price">Price</label>
                                        </div>
                                    {% endif %}
                                </div>
                            </div>
                        </div>

                        <!-- Set-Pc (Only if Chips) -->
                        <div class="row g-2 align-items-center mb-2" id="row_set_pc">
                            <div class="col-sm-4"><label class="extra-small fw-bold">Set-Pc:</label></div>
                            <div class="col-sm-8">
                                <input type="text" id="id_f_set_pc" 
                                       class="form-control form-control-sm uniform-input readonly-gray" 
                                       value="{{ form_data.set_pc|default:'' }}" readonly>
                            </div>
                        </div>

                        <!-- Quantity (KG) (Only if Sample) -->
                        <div class="row g-2 align-items-center mb-2" id="row_quantity_kg">
                            <div class="col-sm-4"><label class="extra-small fw-bold">Quantity (KG):</label></div>
                            <div class="col-sm-8">
                                <input type="text" id="id_f_quantity_kg" 
                                       class="form-control form-control-sm uniform-input readonly-gray" 
                                       value="{{ form_data.quantity_kg|default:'' }}" readonly>
                            </div>
                        </div>

                        <!-- Date Submitted -->
                        <div class="row g-2 align-items-center mb-2">
                            <div class="col-sm-4"><label class="extra-small fw-bold">Date Submitted:</label></div>
                            <div class="col-sm-8">
                                <input type="text" id="id_f_date_submitted" 
                                       class="form-control form-control-sm uniform-input readonly-gray" 
                                       value="{{ form_data.date_submitted|default:'' }}" readonly>
                            </div>
                        </div>

                        <!-- Lot No. -->
                        <div class="row g-2 align-items-center mb-2">
                            <div class="col-sm-4"><label class="extra-small fw-bold">Lot No.:</label></div>
                            <div class="col-sm-8">
                                <input type="text" id="id_f_lot_no" 
                                       class="form-control form-control-sm uniform-input readonly-gray" 
                                       value="{{ form_data.lot_no|default:'N/A' }}" readonly>
                            </div>
                        </div>

                        <!-- AR Number -->
                        <div class="row g-2 align-items-center mb-2">
                            <div class="col-sm-4"><label class="extra-small fw-bold">AR Number:</label></div>
                            <div class="col-sm-8">
                                <input type="text" id="id_f_ar_number" 
                                       class="form-control form-control-sm uniform-input readonly-gray" 
                                       value="{{ form_data.ar_number|default:'' }}" readonly>
                            </div>
                        </div>

                        <!-- AR Date -->
                        <div class="row g-2 align-items-center mb-2">
                            <div class="col-sm-4"><label class="extra-small fw-bold">AR Date:</label></div>
                            <div class="col-sm-8">
                                <input type="text" id="id_f_ar_date" 
                                       class="form-control form-control-sm uniform-input readonly-gray" 
                                       value="{{ form_data.ar_date|default:'' }}" readonly>
                            </div>
                        </div>
                    </div>
                </div>
            </div>

            <!-- ==================== RIGHT COLUMN: FEEDBACK & MONITORING ==================== -->
            <div class="col-lg-6">
                <div class="card h-100 shadow-sm border rounded-3 bg-white">
                    <div class="card-header bg-light border-bottom py-2 px-3">
                        <h6 class="extra-small fw-bold text-uppercase text-teal m-0">Feedback & Monitoring Entry</h6>
                    </div>
                    <div class="card-body p-3">
                        <!-- Feedback Status -->
                        <div class="row g-2 align-items-center mb-3">
                            <div class="col-sm-4"><label class="extra-small fw-bold required-label">Feedback Status:</label></div>
                            <div class="col-sm-8">
                                <select name="feedback_status" id="id_f_feedback_status" class="form-select form-select-sm uniform-input" required>
                                    <option value="">Select status...</option>
                                    {% for choice in form_data.status_choices %}
                                        <option value="{{ choice }}" {% if form_data.feedback_status|lower == choice|lower %}selected{% endif %}>{{ choice }}</option>
                                    {% endfor %}
                                </select>
                            </div>
                        </div>

                        <!-- Abandoned Reason (Dynamically required when status == 'Abandoned') -->
                        <div class="row g-2 align-items-center mb-3" id="row_abandoned_reason" style="display: none;">
                            <div class="col-sm-4"><label class="extra-small fw-bold text-danger required-label">Reason for Abandoned:</label></div>
                            <div class="col-sm-8">
                                <input type="text" name="abandoned_reason" id="id_f_abandoned_reason" 
                                    class="form-control form-control-sm uniform-input" 
                                    placeholder="State reason why it was abandoned..." 
                                    value="{{ form_data.abandoned_reason|default:'' }}">
                            </div>
                        </div>

                        <!-- Order Form No (Dynamically required when status == 'Ordered') -->
                        <div class="row g-2 align-items-center mb-3" id="row_order_form_no" style="display: none;">
                            <div class="col-sm-4"><label class="extra-small fw-bold text-success required-label">Order Form No:</label></div>
                            <div class="col-sm-8">
                                <input type="text" name="order_form_no" id="id_f_order_form_no" 
                                    class="form-control form-control-sm uniform-input" 
                                    placeholder="Enter Order Form / PO #" 
                                    value="{{ form_data.order_form_no|default:'' }}">
                            </div>
                        </div>

                        <!-- Submitted By (Sales dropdown) -->
                        <div class="row g-2 align-items-center mb-3">
                            <div class="col-sm-4"><label class="extra-small fw-bold required-label">Submitted By:</label></div>
                            <div class="col-sm-8">
                                <select name="submitted_by" id="id_f_submitted_by" class="form-select form-select-sm uniform-input" required>
                                    <option value="">Select sales person...</option>
                                    {% for s in form_data.salesman %}
                                        <option value="{{ s.sm_no }}" 
                                            {% if form_data.submitted_by_id == s.sm_no or form_data.submitted_by_id|stringformat:"s" == s.sm_no|stringformat:"s" %}selected{% endif %}>
                                            {{ s.name }}
                                        </option>
                                    {% endfor %}
                                </select>
                            </div>
                        </div>
                        
                        <!-- Date Sample Received -->
                        <div class="row g-2 align-items-center mb-3">
                            <div class="col-sm-4"><label class="extra-small fw-bold">Date Sample Received:</label></div>
                            <div class="col-sm-8">
                                <div class="input-group input-group-sm flatpickr-container" data-wrap="true">
                                    <input type="text" name="date_sample_received" id="id_f_date_sample_received" 
                                        class="form-control uniform-input date-picker-single" 
                                        placeholder="MM/DD/YYYY (Optional)" data-input
                                        value="{{ form_data.date_sample_received|default:'' }}">
                                    <span class="input-group-text uniform-input border-start-0" data-toggle><i class="bi bi-calendar3"></i></span>
                                </div>
                            </div>
                        </div>

                        <!-- Comments -->
                        <div class="row g-2 mb-3">
                            <div class="col-sm-4"><label class="extra-small fw-bold pt-1">Comments:</label></div>
                            <div class="col-sm-8">
                                <textarea name="comments" id="id_f_comments" 
                                        class="form-control form-control-sm uniform-input" rows="3" 
                                        placeholder="Enter feedback observations...">{{ form_data.comments|default:'' }}</textarea>
                            </div>
                        </div>

                        <!-- Storage Details -->
                        <div class="row g-2 align-items-center mb-3">
                            <div class="col-sm-4"><label class="extra-small fw-bold">Storage Details:</label></div>
                            <div class="col-sm-8">
                                <input type="text" name="storage_details" id="id_f_storage_details" 
                                    class="form-control form-control-sm uniform-input" 
                                    placeholder="Box #, Plastic Bin location..." 
                                    value="{{ form_data.storage_details|default:'' }}">
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>

        <!-- Action Button -->
        <div class="mt-3 d-flex justify-content-end">
            <button type="button" class="btn btn-success btn-sm px-4 py-2 shadow-sm btn-save-feedback">
                <i class="bi bi-save me-2"></i>Save Update
            </button>
        </div>
    </form>
</div>

<!-- Dynamic Visibility Script for Submitted options & Feedback Status -->
<script>
    document.addEventListener('DOMContentLoaded', function () {
        // 1. Dynamic Check for Chips (Set-Pc) & Sample (Quantity)
        let isSampleChecked = false;
        let isChipsChecked = false;

        document.querySelectorAll('input[name="submitted_options"]').forEach(cb => {
            const label = document.querySelector(`label[for="${cb.id}"]`);
            if (label) {
                const text = label.textContent.trim().toLowerCase();
                if (text.includes('sample') && cb.checked) isSampleChecked = true;
                if (text.includes('chip') && cb.checked) isChipsChecked = true;
            }
        });

        const rowSetPc = document.getElementById('row_set_pc');
        const rowQuantity = document.getElementById('row_quantity_kg');

        if (rowSetPc) rowSetPc.style.display = isChipsChecked ? '' : 'none';
        if (rowQuantity) rowQuantity.style.display = isSampleChecked ? '' : 'none';

        // 2. Dynamic toggle for Abandoned Reason & Order Form No
        const feedbackStatusSelect = document.getElementById('id_f_feedback_status');
        const rowAbandoned = document.getElementById('row_abandoned_reason');
        const inputAbandoned = document.getElementById('id_f_abandoned_reason');
        const rowOrderForm = document.getElementById('row_order_form_no');
        const inputOrderForm = document.getElementById('id_f_order_form_no');

        function updateFeedbackStatusFields() {
            if (!feedbackStatusSelect) return;
            const val = feedbackStatusSelect.value.trim().toLowerCase();

            if (val === 'abandoned') {
                rowAbandoned.style.display = '';
                inputAbandoned.required = true;

                rowOrderForm.style.display = 'none';
                inputOrderForm.required = false;
            } else if (val === 'ordered') {
                rowOrderForm.style.display = '';
                inputOrderForm.required = true;

                rowAbandoned.style.display = 'none';
                inputAbandoned.required = false;
            } else {
                rowAbandoned.style.display = 'none';
                inputAbandoned.required = false;

                rowOrderForm.style.display = 'none';
                inputOrderForm.required = false;
            }
        }

        if (feedbackStatusSelect) {
            feedbackStatusSelect.addEventListener('change', updateFeedbackStatusFields);
            updateFeedbackStatusFields();
        }

        // Trigger HTML5 validation check when clicking Save Update
        const saveBtn = document.querySelector('.btn-save-feedback');
        const form = document.getElementById('feedbackEntryForm');
        if (saveBtn && form) {
            saveBtn.addEventListener('click', function(e) {
                if (!form.reportValidity()) {
                    e.preventDefault();
                    return false;
                }
            });
        }

        if (feedbackStatusSelect) {
            feedbackStatusSelect.addEventListener('change', updateFeedbackStatusFields);
            updateFeedbackStatusFields(); // Run on initial modal load
        }
    });
</script>
